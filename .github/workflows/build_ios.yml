name: Build iOS App (iPhone)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Runner & IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS App (Release, Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package IPA for Sideloading (AltStore / Sideloadly / LiveContainer)
        run: |
          mkdir -p output/Payload
          cp -r build/ios/iphoneos/Runner.app output/Payload/
          cd output
          zip -r Grovio_SuperMart_iOS.ipa Payload
          zip -r Grovio_SuperMart_Runner.app.zip Payload/Runner.app
          cd ..

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Grovio-SuperMart-iOS-App
          path: |
            output/Grovio_SuperMart_iOS.ipa
            output/Grovio_SuperMart_Runner.app.zip
          retention-days: 30
