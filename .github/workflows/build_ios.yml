name: Build Grovio iOS Apps (iPhone)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-apps:
    name: Build ${{ matrix.app.name }} (iOS)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: "Grovio Customer App"
            entry: "lib/main.dart"
            filename: "Grovio_Customer"
          - name: "Grovio Store App"
            entry: "lib/main_store.dart"
            filename: "Grovio_Store"
          - name: "Grovio Driver App"
            entry: "lib/main_driver.dart"
            filename: "Grovio_Driver"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable SPM & macOS Desktop
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --no-enable-macos-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App (${{ matrix.app.name }})
        run: |
          flutter build ios --release --no-codesign -t ${{ matrix.app.entry }}

      - name: Package Unsigned .ipa
        run: |
          mkdir -p output/Payload
          cp -R build/ios/iphoneos/Runner.app output/Payload/
          cd output
          zip -r ${{ matrix.app.filename }}_iOS.ipa Payload
          cd ..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.filename }}_iOS_Artifact
          path: output/${{ matrix.app.filename }}_iOS.ipa
          retention-days: 14