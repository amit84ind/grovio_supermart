name: Build Grovio iOS Apps (iPhone)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-apps:
    name: Build ${{ matrix.app.name }} (iOS)
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: "Grovio Customer App"
            entry: "lib/main.dart"
            filename: "Grovio_Customer"
          - name: "Grovio Store App"
            entry: "lib/main_store.dart"
            filename: "Grovio_Store"
          - name: "Grovio Driver App"
            entry: "lib/main_driver.dart"
            filename: "Grovio_Driver"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Disable SPM & macOS Desktop
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --no-enable-macos-desktop
          mkdir -p build/ios/SourcePackages/cloud_firestore-6.9.0
          mkdir -p build/macos/SourcePackages/cloud_firestore-6.9.0

      - name: Get Dependencies
        run: flutter pub get

      - name: Precache iOS Artifacts
        run: flutter precache --ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS App (${{ matrix.app.name }})
        run: |
          flutter build ios --release --no-codesign -t ${{ matrix.app.entry }}

      - name: Package iOS IPA & App Zip
        run: |
          mkdir -p output/Payload
          cp -r build/ios/iphoneos/Runner.app output/Payload/
          cd output
          zip -r ${{ matrix.app.filename }}_iOS.ipa Payload
          zip -r ${{ matrix.app.filename }}_Runner.app.zip Payload/Runner.app
          cd ..

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }} (iOS)
          path: |
            output/${{ matrix.app.filename }}_iOS.ipa
            output/${{ matrix.app.filename }}_Runner.app.zip
          retention-days: 30
